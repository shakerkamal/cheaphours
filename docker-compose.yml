# Local development stack: MongoDB (single-node replica set), RabbitMQ, an OCPP 1.6 charge-point
# simulator that connects to the gateway running on this machine (dotnet run ... --role gateway), a
# car-cloud simulator that the worker polls (dotnet run ... --role worker), a heat-pump-cloud simulator
# that posts signed webhooks to the gateway, and the Aspire dashboard that shows what the roles export.
# Copy .env.example to .env first; see README "Run locally".
name: cheaphours

services:
  mongo:
    image: mongo:8.0.32
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Initiates the replica set on first start; healthy once this member is PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); quit(1) }"
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
      start_interval: 2s

  rabbitmq:
    image: rabbitmq:4.2.9-management
    environment:
      # Its own account: the default guest account only works from inside the container.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
      start_interval: 2s

  ocpp-simulator:
    build: ./docker/ocpp-simulator
    image: cheaphours/ocpp-simulator:69bc17c
    environment:
      WS_URL: ws://host.docker.internal:${GATEWAY_PORT:-5081}/ocpp
      CP_ID: ${CP_ID:?set CP_ID in .env}
      PASSWORD: ${CP_PASSWORD:?set CP_PASSWORD in .env}
      # Meter values are sent every 15 s while a charging session runs; see README "Run locally".
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # Healthy while the restart loop runs: connected, or retrying until the gateway is up. The
      # simulator process itself is gone for 3 s between retries, so checking for it flaps.
      test: ["CMD", "pgrep", "-f", "run-simulator"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s

  car-cloud:
    # The car maker's cloud the worker polls (simulators/CheapHours.Simulators.CarCloud).
    build:
      context: .
      dockerfile: simulators/CheapHours.Simulators.CarCloud/Dockerfile
    image: cheaphours/car-cloud-simulator:local
    environment:
      # Admin endpoints plug the demo vehicle in or out and revoke the account; see README "Run locally".
      Admin__Enabled: "true"
      Simulator__ClientSecret: ${CARCLOUD_CLIENT_SECRET:?set CARCLOUD_CLIENT_SECRET in .env}
      Simulator__Accounts__0__Id: acct_demo
      Simulator__Accounts__0__RefreshToken: ${CARCLOUD_SEED_REFRESH_TOKEN:?set CARCLOUD_SEED_REFRESH_TOKEN in .env}
    ports:
      - "5090:8080"
    healthcheck:
      # The ASP.NET image has no curl: a plain HTTP request over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q " 200 " <&3']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s

  heat-pump-cloud:
    # The heat-pump maker's cloud that posts signed webhooks to the gateway on this machine
    # (simulators/CheapHours.Simulators.HeatPumpCloud).
    build:
      context: .
      dockerfile: simulators/CheapHours.Simulators.HeatPumpCloud/Dockerfile
    image: cheaphours/heat-pump-cloud-simulator:local
    environment:
      # Admin endpoints redeliver an event, change the mode or remove the heat pump; see README "Run locally".
      Admin__Enabled: "true"
      Simulator__CallbackUrl: http://host.docker.internal:${GATEWAY_PORT:-5081}/webhooks/heatpumpcloud/acct_demo
      Simulator__SigningSecret: ${HEATPUMP_SIGNING_SECRET:?set HEATPUMP_SIGNING_SECRET in .env}
      Simulator__AccountId: acct_demo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "5091:8080"
    healthcheck:
      # The ASP.NET image has no curl: a plain HTTP request over bash's /dev/tcp.
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q " 200 " <&3']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
      start_interval: 2s

  dashboard:
    # The standalone Aspire dashboard: traces, metrics and logs the three roles export over OTLP when started
    # with OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317 (README "Observe a command"). Local only: no login,
    # bound to loopback, never deployed. The image has no shell, so it declares no health check.
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.6.1
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "127.0.0.1:18888:18888" # UI
      - "127.0.0.1:4317:18889" # OTLP gRPC
      - "127.0.0.1:4318:18890" # OTLP HTTP

volumes:
  mongo-data:
