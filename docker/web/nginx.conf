# The owner dashboard (dashboard/site) and the public API on one origin: the page is served as files and every
# /v1 request is forwarded, headers unchanged, to the API role running on the developer's machine. The page
# therefore needs no cross-origin access and the API no CORS setup. Mounted as /etc/nginx/conf.d/default.conf.

# The page itself is never cached, so a changed page is picked up; modules and styles are revalidated.
# An empty value adds no header, so API responses keep their own Cache-Control.
map $uri $dashboard_cache_control {
    default         "";
    /               "no-store";
    /index.html     "no-store";
    ~\.(mjs|css|svg)$ "no-cache";
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    charset utf-8;

    root /usr/share/nginx/dashboard;
    index index.html;

    # Sent with every response, the page's and the API's. Only the page's own scripts, styles and
    # connections are allowed; nothing may frame it.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control $dashboard_cache_control always;

    location /v1/ {
        # host.docker.internal is the developer's machine (extra_hosts: host-gateway). With the API role
        # stopped the connection is refused and nginx answers 502, which the page shows as "API unreachable".
        proxy_pass http://host.docker.internal:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # The image's mime.types has no entry for .mjs, and browsers refuse a module of any other type.
    location ~ \.mjs$ {
        types { }
        default_type text/javascript;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
